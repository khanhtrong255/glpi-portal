# --- Ẩn thông tin server (global, không được đặt trong VirtualHost) ---
ServerTokens Prod
ServerSignature Off

<VirtualHost *:80>
    ServerName localhost

    DocumentRoot /var/www/glpi/public

    # --- Bảo mật: chặn truy cập thư mục nhạy cảm ---
    <Directory /var/www/glpi>
        Options -Indexes -FollowSymLinks
        AllowOverride None
        Require all denied
    </Directory>

    <Directory /var/www/glpi/public>
        # FollowSymLinks bắt buộc để RewriteRule hoạt động
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted

        RewriteEngine On
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteRule ^(.*)$ index.php [QSA,L]
    </Directory>

    # --- Headers bảo mật ---
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set X-XSS-Protection "1; mode=block"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"

    # --- Logs ---
    ErrorLog /var/log/apache2/glpi_error.log
    CustomLog /var/log/apache2/glpi_access.log combined
</VirtualHost>